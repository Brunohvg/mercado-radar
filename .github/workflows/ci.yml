name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main
      - "feature/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: radar_test
          POSTGRES_PASSWORD: radar_test
          POSTGRES_DB: radar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U radar_test -d radar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://radar_test:radar_test@127.0.0.1:5432/radar_test?schema=public
      NEXT_TELEMETRY_DISABLED: "1"
      RADAR_QA_ARTIFACTS: artifacts/qa

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Prisma generate
        run: npm run db:generate

      - name: Typecheck
        run: npm run typecheck

      - name: Financial and decision regression tests
        run: npm test

      - name: Extension syntax
        run: node --check extension/background.js && node --check extension/content.js && node --check extension/sidepanel.js && node --check extension/selectors.js && node --check extension/panel-model.js && node --check extension/product-analysis.js

      - name: Chromium for extension regression
        run: npx playwright install --with-deps chromium

      - name: Extension layout and interaction regression
        run: npm run test:extension

      - name: Market dashboard layout and interaction regression
        run: npm run test:market

      - name: Production extension package
        run: node scripts/build-extension.mjs

      - name: Build
        run: npm run build
        env:
          APP_ENCRYPTION_KEY: build-only-key-not-for-production

      - name: Migrations on clean PostgreSQL
        run: npm run db:deploy

      - name: Migration upgrade with existing data
        run: node tests/migration-upgrade.mjs
        env:
          RADAR_TEST_DATABASE: "1"

      - name: HTTP isolation and authentication smoke tests
        run: npm run test:integration
        env:
          RADAR_TEST_DATABASE: "1"

      - name: Browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-browser-evidence
          path: artifacts/qa
          if-no-files-found: ignore

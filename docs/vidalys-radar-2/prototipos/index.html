:root{--blue:#1d4ed8;--blue-dark:#1e40af;--blue-soft:#eef3ff;--ink:#14263d;--muted:#5c6b7f;--bg:#f5f7fb;--line:#e2e7ef;--control:#7c8da3;--green:#0e7660;--green-soft:#e8f5ef;--amber:#92400e;--amber-soft:#fff7e7;--red:#b42318;--red-soft:#fef0ee;--cyan:#22b8cf;--white:#fff}

function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function money(v){return v==null?"—":v.toLocaleString("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:2})}
function pct(v){return v==null?"—":v.toLocaleString("pt-BR",{minimumFractionDigits:1,maximumFractionDigits:1})+"%"}
function parseValue(v){if(String(v).trim()==="")return null;var s=String(v).trim();if(s.indexOf(",")>=0)s=s.replace(/\./g,"").replace(",",".");var n=Number(s);return Number.isFinite(n)?n:null}
function round(v){return Math.round((v+Number.EPSILON)*100)/100}
function calculate(input){
 var names={sale:"preço de venda",purchase:"custo da mercadoria",quantity:"quantidade do lote",freight:"frete de aquisição",commission:"comissão",fixed:"tarifa fixa",shipping:"envio do vendedor",operation:"embalagem/operação",tax:"tributos",ads:"Ads",returns:"devoluções",margin:"meta de margem",roi:"meta de ROI"};
 var missing=Object.keys(names).filter(function(k){return input[k]==null||!Number.isFinite(input[k])||input[k]<0});
 if(input.sale!=null&&input.sale<=0)missing.push("preço positivo");if(input.quantity!=null&&(!Number.isInteger(input.quantity)||input.quantity<1))missing.push("lote válido");
 if(missing.length)return {ready:false,missing:missing.map(function(k){return names[k]||k})};
 if(input.commission+input.tax>=100)return {ready:false,missing:["percentuais válidos"]};
 var landed=input.purchase+input.freight/input.quantity,fee=round(input.sale*input.commission/100)+input.fixed,tax=round(input.sale*input.tax/100);
 var contribution=round(input.sale-landed-fee-input.shipping-input.operation-tax-input.ads-input.returns);
 var investment=landed+input.operation,roi=investment>0?contribution/investment*100:null;
 var available=input.sale-fee-input.shipping-input.operation-tax-input.ads-input.returns;
 var marginLimit=available-input.sale*input.margin/100,roiLimit=(available-input.roi/100*input.operation)/(1+input.roi/100);
 var ceiling=Math.floor(Math.max(0,Math.min(marginLimit,roiLimit))*100)/100;
 var denominator=1-input.commission/100-input.tax/100-input.margin/100;
 var floor=denominator>0?(landed+input.fixed+input.shipping+input.operation+input.ads+input.returns)/denominator:null;
 var capital=round(input.purchase*input.quantity+input.freight+(input.operation+input.ads+input.returns)*input.quantity);
 return {ready:true,missing:[],landed:landed,fee:fee,tax:tax,contribution:contribution,margin:contribution/input.sale*100,roi:roi,capital:capital,ceiling:ceiling,floor:floor==null?null:Math.ceil((floor-1e-9)*100)/100,limiting:marginLimit<=roiLimit?"margem":"ROI",lotContribution:round(contribution*input.quantity)};
}
function sample(){var d=Object.assign({},state.scenario==="custom"&&state.financialDraft?state.financialDraft:demo);if(state.scenario==="missing")d.freight=null;if(state.scenario==="loss")d.purchase=78;return d}

function readFinance(){var d=sample();document.querySelectorAll("[data-finance]").forEach(function(el){d[el.dataset.finance]=parseValue(el.value)});return d}
function updateFinance(){state.financialDraft=readFinance();state.scenario="custom";var target=document.getElementById("finance-result");if(target){target.innerHTML=financeResult(readFinance());target.querySelectorAll("[data-action]").forEach(function(b){b.onclick=function(){act(b.dataset.action)}})}}
function bind(){document.querySelectorAll("#app [data-go]").forEach(function(b){b.onclick=function(e){e.preventDefault();go(b.dataset.go)}});document.querySelectorAll("#app [data-action]").forEach(function(b){b.onclick=function(){act(b.dataset.action)}});document.querySelectorAll("[data-scenario]").forEach(function(b){b.onclick=function(){state.scenario=b.dataset.scenario;render()}});document.querySelectorAll("[data-tab]").forEach(function(b){b.onclick=function(){state.tab=b.dataset.tab;render()}});document.querySelectorAll("[data-ext-tab]").forEach(function(b){b.onclick=function(){state.extTab=b.dataset.extTab;render()}});document.querySelectorAll("[data-finance]").forEach(function(el){el.oninput=updateFinance});var search=document.getElementById("search-form");if(search)search.onsubmit=function(e){e.preventDefault();state.query=search.querySelector("input").value.trim();go("discover")};var filter=document.getElementById("product-filter");if(filter)filter.oninput=function(){state.query=filter.value;document.getElementById("product-rows").innerHTML=productRows();document.querySelectorAll("#product-rows [data-go]").forEach(function(b){b.onclick=function(){go(b.dataset.go)}})};var identity=document.getElementById("identity-filter");if(identity){identity.value=state.identity||"all";identity.onchange=function(){state.identity=identity.value;render()}}var buyer=document.getElementById("buyer-filter");if(buyer)buyer.onchange=function(){state.buyer=buyer.value;render()};var loginForm=document.getElementById("login-demo");if(loginForm)loginForm.onsubmit=function(e){e.preventDefault();go("home")};var menu=document.getElementById("menu-btn");if(menu)menu.onclick=function(){document.getElementById("sidebar").classList.toggle("mobile-drawer")}}
document.addEventListener("keydown",function(e){var modal=document.querySelector('[role="dialog"]');if(e.key==="Escape"){if(modal)closeModal();else{var side=document.getElementById("sidebar");if(side)side.classList.remove("mobile-drawer")}}if(e.key==="Tab"&&modal){var focusable=Array.from(modal.querySelectorAll('button,input,select,textarea,a[href]')).filter(function(el){return !el.disabled});var first=focusable[0],last=focusable[focusable.length-1];if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault()}else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault()}}});
document.getElementById("view-select").innerHTML=views.map(function(v){return '<option value="'+v[0]+'">'+v[1]+'</option>'}).join("");
document.getElementById("view-select").onchange=function(e){go(e.target.value)};
document.getElementById("desktop-btn").onclick=function(){state.mobile=false;render()};
document.getElementById("mobile-btn").onclick=function(){state.mobile=true;render()};
var hash=location.hash.slice(1);if(hash.endsWith("-mobile")){state.mobile=true;hash=hash.slice(0,-7)}if(views.some(function(v){return v[0]===hash}))state.screen=hash;
window.radarPrototype={calculate:calculate,baseline:Object.assign({},demo),navigate:go};
render();
</script>

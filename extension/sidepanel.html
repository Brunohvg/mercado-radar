<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mercado Radar</title>
  <style>
    body{font-family:Arial,sans-serif;margin:0;background:#f6f8f7;color:#17211b}
    main{padding:16px}
    .brand{font-size:20px;font-weight:700;margin-bottom:16px}
    .card{background:white;border:1px solid #e3e8e5;border-radius:12px;padding:14px;margin-bottom:12px}
    label{display:block;font-size:12px;margin:10px 0 4px}
    input{box-sizing:border-box;width:100%;padding:10px;border:1px solid #ccd6d0;border-radius:8px}
    button{width:100%;padding:10px;border:0;border-radius:8px;background:#14813f;color:#fff;font-weight:700;cursor:pointer;margin-top:12px}
    .muted{font-size:12px;color:#647067}
  </style>
</head>
<body>
  <main>
    <div class="brand">Mercado Radar</div>
    <div class="card">
      <strong>Extensão conectada</strong>
      <p class="muted">A camada de inteligência aparece nas buscas do Mercado Livre. A calculadora completa entra na próxima etapa.</p>
    </div>
    <div class="card">
      <strong>Configuração</strong>
      <label>URL da API</label>
      <input id="apiBase" placeholder="https://radar.optarys.com.br" />
      <label>Chave da extensão</label>
      <input id="apiKey" type="password" placeholder="RADAR_EXTENSION_API_KEY" />
      <button id="save">Salvar</button>
      <p id="status" class="muted"></p>
    </div>
  </main>
  <script src="sidepanel.js"></script>
</body>
</html>
